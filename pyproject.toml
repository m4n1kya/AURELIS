[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelis"
version = "1.2.0"
description = "Privacy-first deterministic financial affordability and cash-flow intelligence engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AURELIS Contributors" }
]
keywords = ["fintech", "cash-flow", "deterministic-engine", "affordability", "gemini", "fastapi"]
dependencies = [
    "pandas>=2.0.0",
    "google-generativeai>=0.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "engine"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
